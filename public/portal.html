<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client portal — Adderley Moss</title><meta name="robots" content="noindex"><meta name="theme-color" content="#f4f2ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%236e0f0a'/%3E%3Ctext x='20' y='25' text-anchor='middle' font-family='Georgia' font-size='13' fill='%23f4e4d4'%3EAM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/site.css">
<style>
  body { background: var(--paper); }
  .pw { max-width: 1240px; margin: 0 auto; padding: 120px var(--gut) 90px; }
  .ph { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; border-bottom: 2px solid var(--ink); padding-bottom: 22px; }
  .ph h1 { font: 400 clamp(42px, 6vw, 84px)/.95 var(--fd); letter-spacing: -.01em; } .ph h1 em { font-family: var(--fs); color: var(--red); }
  .ph .ref { font: 400 12px var(--fm); text-transform: uppercase; letter-spacing: .12em; color: var(--mute); margin-bottom: 14px; }
  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--ink); }
  .strip > div { padding: 18px 18px 18px 0; border-right: 1px solid var(--hair); } .strip > div + div { padding-left: 18px; } .strip > div:last-child { border-right: 0; }
  .strip small { font: 400 11px var(--fm); text-transform: uppercase; letter-spacing: .1em; color: var(--mute); } .strip b { display: block; font: 400 38px/1.1 var(--fd); margin-top: 4px; } .strip .red { color: var(--red); }
  @media (max-width: 760px) { .strip { grid-template-columns: 1fr 1fr; } .strip > div:nth-child(2) { border-right: 0; } .strip > div:nth-child(3) { padding-left: 0; } .ph { grid-template-columns: 1fr; } }
  .blk { margin-top: 46px; } .blk > h2 { display: flex; align-items: baseline; gap: 14px; font: 400 30px/1.1 var(--fd); padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
  .blk > h2 span { font: 700 12px var(--fm); color: var(--red); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--hair); } .row b { display: block; font-weight: 600; } .row small { color: var(--mute); font-size: 13.5px; }
  .row .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .need { box-shadow: inset 3px 0 0 var(--red); padding-left: 16px; }
  .mats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-left: 1px solid var(--ink); } @media (max-width: 820px) { .mats { grid-template-columns: 1fr; } }
  .mat { display: block; padding: 22px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); text-decoration: none; color: var(--ink); background: var(--paper); transition: background .25s; } .mat:hover { background: var(--white); }
  .mat .n { font: 700 12px var(--fm); color: var(--red); } .mat h3 { font: 400 26px/1.15 var(--fd); margin: 6px 0 4px; } .mat p { font-size: 14px; color: var(--ink-2); }
  .prog { display: flex; gap: 3px; margin: 16px 0 8px; } .prog i { flex: 1; height: 6px; background: var(--paper-3); } .prog i.d { background: var(--ink); } .prog i.c { background: var(--red); }
  .stg { display: grid; gap: 0; border: 1px solid var(--ink); margin-top: 22px; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); } .stg > div { padding: 12px; border-right: 1px solid var(--hair); font-size: 13px; color: var(--mute); } .stg > div:last-child { border-right: 0; }
  .stg > div small { display: block; font: 700 11px var(--fm); } .stg .d { color: var(--ink); background: var(--white); } .stg .c { background: var(--ink); color: var(--paper); } .stg .c small { color: #ff6a5c; }
  @media (max-width: 760px) { .stg { grid-template-columns: 1fr; } .stg > div { border-right: 0; border-bottom: 1px solid var(--hair); } }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; } @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .thread { display: grid; gap: 10px; max-height: 460px; overflow: auto; padding: 16px 0; } .msg { max-width: 82%; padding: 12px 16px; background: var(--white); box-shadow: inset 0 0 0 1px var(--hair); font-size: 15px; } .msg.me { margin-left: auto; background: var(--ink); color: var(--paper); } .msg small { display: block; font: 400 11px var(--fm); opacity: .6; margin-bottom: 4px; }
  textarea.box { width: 100%; padding: 14px; border: 1.5px solid var(--ink); background: var(--white); font: 400 15px var(--f); resize: vertical; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font: 700 11px var(--fm); text-transform: uppercase; letter-spacing: .06em; background: var(--paper-2); } .tag.r { background: var(--redwash); color: var(--red-2); } .tag.g { background: #e1efe6; color: #2c6e49; } .tag.b { background: #e3e8f6; color: var(--blue); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } td, th { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--hair); text-align: left; } th { font: 400 11px var(--fm); text-transform: uppercase; letter-spacing: .08em; color: var(--mute); } td.n, th.n { text-align: right; font-family: var(--fm); }
  @media (max-width: 700px) { table { display: block; overflow-x: auto; white-space: nowrap; } }
  .back { font: 400 13px var(--fm); color: var(--ink); text-decoration: none; } .back:hover { color: var(--red); }
  .card-in { display: grid; gap: 12px; } .card-in input { width: 100%; padding: 13px 0; border: 0; border-bottom: 1.5px solid var(--ink); background: none; font: 400 18px var(--fm); }
  .modal__c h2 { font: 400 28px/1.1 var(--fd); } .mh { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; } .mh button { border: 0; background: none; cursor: pointer; font-size: 22px; }
  .mh svg { width: 20px; }
</style>
</head>
<body>
<header class="mast"><div class="mast__in" style="grid-template-columns:1fr auto 1fr"><span class="mono" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase" id="who"></span><a class="brand" href="/"><b>ADDERLEY MOSS</b><small>Client portal · privileged &amp; confidential</small></a><div class="mast__r"><button class="pill pill--line pill--sm" id="out">Sign out</button></div></div></header>
<main class="pw" id="main"><p class="fine">Loading…</p></main>
<script src="/js/core.js"></script>
<script>
(async () => {
  const { $, $$, esc, api, date, short, when, ago, toast, modal, mhead } = NC; const money = (c) => NC.money(c);
  let me; try { me = await api('/api/me'); } catch { location.href = '/login?next=/portal'; return; }
  if (me.role !== 'client') { location.href = '/console'; return; }
  $('#out').onclick = async () => { await api('/api/auth/logout', {}); location.href = '/'; };
  const main = $('#main'), tag = (s) => { const c = { paid: 'g', signed: 'g', accepted: 'g', verified: 'g', issued: 'b', sent: 'r', partial: 'r', requested: 'r', rejected: 'r', received: 'b', open: 'g', pending: '', closed: '' }[s] ?? ''; return `<span class="tag ${c}">${esc(String(s).replace(/_/g, ' '))}</span>`; };
  const prog = (m) => `<div class="prog">${m.stages.map((_, i) => `<i class="${i < m.stage_index ? 'd' : i === m.stage_index ? 'c' : ''}"></i>`).join('')}</div>`;
  const filePick = (accept = '') => new Promise((res) => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => res(i.files[0]); i.click(); });
  function payModal(inv, after) {
    const m = modal(`${mhead(`Pay ${esc(inv.number)}`, `${money(inv.total_cents - inv.paid_cents - (inv.written_off_cents || 0))} due`)}<form class="card-in" id="pf"><label class="fine">Card number<input name="card" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" required></label><p class="fine">Test mode — 4242… succeeds, 4000… is declined. Prefer to wire? Our bank details are on the invoice.</p><button class="pill pill--red">Pay securely <i>→</i></button></form>`);
    m.$('#pf').onsubmit = async (e) => { e.preventDefault(); const b = e.submitter; b.disabled = true; try { await api(`/api/portal/invoices/${inv.id}/pay`, { card: e.target.card.value }); m.close(); toast('Paid — thank you. A receipt is on its way.'); after(); } catch (er) { toast(er.message, true); b.disabled = false; } };
  }

  async function home() {
    const d = await api('/api/portal'), c = d.client, open = d.matters.filter((m) => m.status !== 'closed'), owed = d.invoices.filter((i) => ['issued', 'partial'].includes(i.status));
    const kycNeed = d.kyc.items.filter((k) => ['requested', 'rejected'].includes(k.status) || k.expired);
    $('#who').textContent = c.number;
    const needs = [
      ...d.to_sign.map((x) => `<div class="row need"><div><b>Sign: ${esc(x.name)}</b><small>Sent ${short(x.created_at)} · takes about two minutes</small></div><div class="acts"><a class="pill pill--red pill--sm" href="/sign/${esc(x.token)}">Review &amp; sign <i>→</i></a></div></div>`),
      ...kycNeed.map((k) => `<div class="row need"><div><b>Upload: ${esc(k.label)}</b><small>${k.status === 'rejected' ? 'We could not accept the last copy — please upload a clearer one.' : k.expired ? 'Your document has expired.' : 'Required by Bahamian anti-money-laundering law before we can hold funds for you.'}</small></div><div class="acts"><button class="pill pill--ink pill--sm" data-kyc="${k.kind}">Upload</button></div></div>`),
      ...d.tasks.map((t) => `<div class="row need"><div><b>${esc(t.title)}</b><small>${esc(t.matter_no)}${t.due_on ? ' · by ' + date(t.due_on, { weekday: 'short', month: 'short', day: 'numeric' }) : ''}</small></div><div class="acts"><button class="pill pill--line pill--sm" data-tup="${t.id}">Upload a file</button><button class="pill pill--ink pill--sm" data-tdone="${t.id}">Mark done</button></div></div>`),
      ...owed.map((i) => `<div class="row need"><div><b>Invoice ${esc(i.number)} — ${money(i.total_cents - i.paid_cents - i.written_off_cents)}</b><small>${esc(i.matter_no)} · due ${short(i.due_on)}</small></div><div class="acts"><a class="pill pill--line pill--sm" href="/pay/${esc(i.token)}" target="_blank" rel="noopener">View</a><button class="pill pill--red pill--sm" data-pay="${i.id}">Pay now</button></div></div>`)];
    main.innerHTML = `<div class="ph"><div><p class="ref">${esc(c.number)} · ${esc(c.kind)} client</p><h1>Good ${new Date().getHours() < 12 ? 'morning' : 'day'},<br><em>${esc(me.name.split(' ')[0])}.</em></h1></div><a class="pill pill--red" href="#msg">Message your attorney <i>→</i></a></div>
      <div class="strip"><div><small>Open matters</small><b>${open.length}</b></div><div><small>Waiting on you</small><b class="${needs.length ? 'red' : ''}">${needs.length}</b></div><div><small>Outstanding</small><b>${money(d.ar.total)}</b></div><div><small>Held in trust for you</small><b>${money(d.trust_cents)}</b></div></div>
      <section class="blk"><h2><span>§1</span>Waiting on you</h2>${needs.join('') || '<p class="fine" style="padding:18px 0">Nothing — we will let you know the moment we need something.</p>'}</section>
      <section class="blk"><h2><span>§2</span>Your matters</h2><div class="mats">${d.matters.map((m) => `<a class="mat" href="#m/${m.id}"><span class="n">${esc(m.number)}${m.unread ? ` · <span class="tag r">${m.unread} new message${m.unread > 1 ? 's' : ''}</span>` : ''}</span><h3>${esc(m.title)}</h3><p>${esc(m.area)} · ${esc(m.responsible.name)}</p>${prog(m)}<p><b>${esc(m.stage)}</b> · stage ${m.stage_index + 1} of ${m.stages.length} ${m.status === 'closed' ? tag('closed') : ''}</p>${m.next ? `<p class="fine" style="margin-top:6px">Next: ${esc(m.next.title)} — ${when(m.next.start_at)}</p>` : ''}</a>`).join('')}</div></section>
      <div class="cols"><section class="blk"><h2><span>§3</span>Diary</h2>${d.events.map((e) => `<div class="row"><div><b>${esc(e.title)}</b><small>${esc(e.matter_no)}${e.location ? ' · ' + esc(e.location) : ''}</small></div><span class="mono" style="font-size:13px">${when(e.start_at)}</span></div>`).join('') || '<p class="fine" style="padding:18px 0">Nothing scheduled.</p>'}</section>
        <section class="blk"><h2><span>§4</span>Know your client</h2>${d.kyc.items.map((k) => `<div class="row"><div><b>${esc(k.label)}</b><small>${k.filename ? esc(k.filename) : 'not yet provided'}${k.expires_on ? ' · expires ' + short(k.expires_on) : ''}</small></div>${tag(k.expired ? 'expired' : k.status)}</div>`).join('')}<p class="fine" style="margin-top:12px">Status: ${tag(d.kyc.status)} — documents are seen only by our compliance team.</p></section></div>
      <section class="blk"><h2><span>§5</span>Invoices</h2><table><thead><tr><th>Invoice</th><th>Matter</th><th>Issued</th><th class="n">Total</th><th class="n">Balance</th><th></th></tr></thead><tbody>${d.invoices.map((i) => `<tr><td class="mono">${esc(i.number)}</td><td class="mono">${esc(i.matter_no)}</td><td>${short(i.issued_on)}</td><td class="n">${money(i.total_cents)}</td><td class="n">${money(i.total_cents - i.paid_cents - i.written_off_cents)}</td><td>${tag(i.status)} <a href="/pay/${esc(i.token)}" target="_blank" rel="noopener" class="back">open ↗</a></td></tr>`).join('') || '<tr><td colspan="6" class="fine">No invoices.</td></tr>'}</tbody></table></section>`;
    $$('[data-pay]').forEach((b) => (b.onclick = () => payModal(d.invoices.find((i) => i.id == b.dataset.pay), home)));
    $$('[data-kyc]').forEach((b) => (b.onclick = async () => { const f = await filePick('image/*,.pdf'); if (!f) return; try { await api('/api/portal/kyc', { kind: b.dataset.kyc, filename: f.name }); toast('Received — our compliance team will review it'); home(); } catch (e) { toast(e.message, true); } }));
    $$('[data-tup]').forEach((b) => (b.onclick = async () => { const f = await filePick(); if (!f) return; await api(`/api/portal/tasks/${b.dataset.tup}/done`, { filename: f.name, size_kb: Math.round(f.size / 1024) }); toast('Uploaded to your matter file'); home(); }));
    $$('[data-tdone]').forEach((b) => (b.onclick = async () => { await api(`/api/portal/tasks/${b.dataset.tdone}/done`, {}); toast('Thank you'); home(); }));
    if (location.hash === '#msg' && open[0]) location.hash = `#m/${open[0].id}`;
  }

  async function matter(id) {
    const m = await api('/api/portal/matters/' + id); let run = 0;
    main.innerHTML = `<a class="back" href="#">← All matters</a><div class="ph" style="margin-top:18px"><div><p class="ref">${esc(m.number)} · ${esc(m.area)}${m.court ? ' · ' + esc(m.court) : ''}${m.case_no ? ' · ' + esc(m.case_no) : ''}</p><h1>${esc(m.title)}</h1></div>${tag(m.status)}</div>
      <div class="stg" style="--n:${m.stages.length}">${m.stages.map((s, i) => `<div class="${i < m.stage_index ? 'd' : i === m.stage_index ? 'c' : ''}"><small>${String(i + 1).padStart(2, '0')}</small>${esc(s)}</div>`).join('')}</div>
      <div class="cols"><section class="blk" id="msg"><h2><span>§1</span>Secure messages</h2><div class="thread" id="thr">${m.messages.map((x) => `<div class="msg ${x.from_client ? 'me' : ''}"><small>${x.from_client ? 'You' : esc(x.author || 'Adderley Moss')} · ${ago(x.created_at)}</small>${esc(x.body)}</div>`).join('') || '<p class="fine">Start the conversation — messages here are encrypted in transit and kept on your file.</p>'}</div>
          <form id="mf"><textarea class="box" name="body" rows="3" required placeholder="Write to ${esc(m.responsible.name)}…" aria-label="Message"></textarea><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="pill pill--red pill--sm">Send <i>→</i></button></div></form></section>
        <section class="blk"><h2><span>§2</span>Your team</h2><div class="row"><div><b>${esc(m.responsible.name)}</b><small>${esc(m.responsible.title || '')} · responsible attorney</small></div></div>${m.team.filter((t) => t.name !== m.responsible.name).map((t) => `<div class="row"><div><b>${esc(t.name)}</b><small>${esc(t.title || '')} · ${esc(t.role || '')}</small></div></div>`).join('')}
          <h2 style="font:400 24px var(--fd);margin-top:30px;padding-bottom:8px;border-bottom:1px solid var(--ink)">Dates</h2>${m.events.map((e) => `<div class="row" style="${e.done ? 'opacity:.5' : ''}"><div><b>${esc(e.title)}</b><small>${e.location ? esc(e.location) : ''}</small></div><span class="mono" style="font-size:12.5px">${when(e.start_at)}</span></div>`).join('') || '<p class="fine" style="padding:12px 0">None yet.</p>'}</section></div>
      <section class="blk"><h2><span>§3</span>Documents</h2>${m.documents.map((x) => `<div class="row"><div><b>${esc(x.name)}</b><small>${esc(x.kind)} · ${short(x.created_at)}${x.signed_at ? ' · signed ' + short(x.signed_at) : ''}</small></div><div class="acts">${tag(x.status)}${x.token && ['sent', 'signed'].includes(x.status) ? `<a class="pill ${x.status === 'sent' ? 'pill--red' : 'pill--line'} pill--sm" href="/sign/${esc(x.token)}">${x.status === 'sent' ? 'Sign' : 'View'}</a>` : ''}</div></div>`).join('') || '<p class="fine" style="padding:12px 0">Nothing shared yet.</p>'}</section>
      ${m.tasks.length ? `<section class="blk"><h2><span>§4</span>Requests from us</h2>${m.tasks.map((t) => `<div class="row ${t.status === 'open' ? 'need' : ''}" style="${t.status === 'done' ? 'opacity:.5' : ''}"><div><b>${esc(t.title)}</b><small>${t.status === 'done' ? 'Done ' + short(t.done_at) : t.due_on ? 'By ' + short(t.due_on) : ''}</small></div>${t.status === 'open' ? `<div class="acts"><button class="pill pill--line pill--sm" data-tup="${t.id}">Upload</button><button class="pill pill--ink pill--sm" data-tdone="${t.id}">Done</button></div>` : tag('done')}</div>`).join('')}</section>` : ''}
      <div class="cols"><section class="blk"><h2><span>§5</span>Client account (trust)</h2><table><thead><tr><th>Date</th><th>Detail</th><th class="n">Amount</th><th class="n">Balance</th></tr></thead><tbody>${m.trust.map((t) => { run += t.amount_cents; return `<tr><td class="mono" style="font-size:12.5px">${short(t.date)}</td><td>${esc(t.description || t.kind)}</td><td class="n">${money(t.amount_cents)}</td><td class="n"><b>${money(run)}</b></td></tr>`; }).join('') || '<tr><td colspan="4" class="fine">No funds held on this matter.</td></tr>'}</tbody></table><p class="fine" style="margin-top:10px">Held in a segregated client account — never mixed with firm money.</p></section>
        <section class="blk"><h2><span>§6</span>Invoices</h2>${m.invoices.map((i) => `<div class="row"><div><b class="mono">${esc(i.number)}</b><small>${short(i.issued_on)} · ${money(i.total_cents)}</small></div><div class="acts">${tag(i.status)}<a class="pill pill--line pill--sm" href="/pay/${esc(i.token)}" target="_blank" rel="noopener">Open</a></div></div>`).join('') || '<p class="fine" style="padding:12px 0">Nothing billed yet.</p>'}</section></div>`;
    const thr = $('#thr'); thr.scrollTop = thr.scrollHeight;
    $('#mf').onsubmit = async (e) => { e.preventDefault(); await api(`/api/portal/matters/${id}/messages`, { body: e.target.body.value }); toast('Sent securely'); matter(id); };
    $$('[data-tup]').forEach((b) => (b.onclick = async () => { const f = await filePick(); if (!f) return; await api(`/api/portal/tasks/${b.dataset.tup}/done`, { filename: f.name, size_kb: Math.round(f.size / 1024) }); toast('Uploaded'); matter(id); }));
    $$('[data-tdone]').forEach((b) => (b.onclick = async () => { await api(`/api/portal/tasks/${b.dataset.tdone}/done`, {}); toast('Thank you'); matter(id); }));
  }
  const route = () => { const h = location.hash.slice(1); scrollTo(0, 0); (h.startsWith('m/') ? matter(h.slice(2)) : home()).catch((e) => (main.innerHTML = `<p class="fine">${esc(e.message)}</p>`)); };
  addEventListener('hashchange', () => { $$('.modal').forEach((x) => x.remove()); route(); }); route();
})();
</script>
</body>
</html>
